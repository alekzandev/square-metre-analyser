[project]
name = "square-metre-analyser"
version = "0.1.0"
description = "This project analyses price per square metre for a given area and provides insights based on the data collected. It can be used for applications such as real estate, urban planning, and agriculture."
authors = [
    {name = "Cristina Ortiz",email = "robotina00110011@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "requests",
    "beautifulsoup4",
    "boto3",
    "python-dotenv"
]


[tool.poetry]
package-mode = false


[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
